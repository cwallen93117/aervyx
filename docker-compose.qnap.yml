services:
  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-flightcomp}
      POSTGRES_USER: ${POSTGRES_USER:-flightcomp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-flightcomp}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-flightcomp} -d ${POSTGRES_DB:-flightcomp}"]
      interval: 10s
      timeout: 5s
      retries: 10

  mqtt:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    ports:
      - "${MQTT_PORT:-1883}:1883"
      - "${MQTT_WS_PORT:-9001}:9001"
    volumes:
      - ./mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    depends_on:
      db:
        condition: service_healthy
      mqtt:
        condition: service_started
    env_file:
      - ./backend/.env
    environment:
      MQTT_HOST: mqtt
      MQTT_PORT: "1883"
      MESH_MQTT_TOPIC_PREFIX: aervyx
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - backend_uploads:/app/storage/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
    depends_on:
      - backend
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-flightcomp}:${POSTGRES_PASSWORD:-flightcomp}@db:5432/${POSTGRES_DB:-flightcomp}
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:3000"

volumes:
  postgres_data:
  backend_uploads:
  mosquitto_data:
  mosquitto_log:
