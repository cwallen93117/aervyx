# Aervyx Mosquitto MQTT broker configuration

per_listener_settings true

# Default MQTT listener
listener 1883
protocol mqtt
allow_anonymous true

# WebSocket listener (for browser clients)
listener 9001
protocol websockets
allow_anonymous true

# Optional VM-managed listener snippets, such as public TLS on 8883.
include_dir /mosquitto/config/conf.d

# Persistence
persistence true
persistence_location /mosquitto/data/

# Logging
log_dest file /mosquitto/log/mosquitto.log
log_type error
log_type warning
log_type notice
