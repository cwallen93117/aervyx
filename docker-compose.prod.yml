services:
  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    command: postgres -c shared_buffers=256MB -c work_mem=16MB -c effective_cache_size=512MB -c random_page_cost=1.1 -c max_connections=100
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-flightcomp}
      POSTGRES_USER: ${POSTGRES_USER:-flightcomp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  mosquitto:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    ports:
      - "${MOSQUITTO_PLAIN_BIND:-0.0.0.0}:${MOSQUITTO_PLAIN_PORT:-1883}:1883"
      - "${MOSQUITTO_TLS_BIND:-0.0.0.0}:${MOSQUITTO_TLS_PORT:-8883}:8883"
    volumes:
      - ./mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ${MOSQUITTO_EXTRA_CONFIG_DIR:-./mosquitto/config/conf.d}:/mosquitto/config/conf.d:ro
      - ${MOSQUITTO_CERT_DIR:-./mosquitto/certs}:/mosquitto/certs:ro
      - ${MOSQUITTO_SECRET_DIR:-./mosquitto/secrets}:/mosquitto/secrets:ro
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log

  valhalla:
    image: ghcr.io/gis-ops/docker-valhalla/valhalla:latest
    restart: unless-stopped
    environment:
      tile_urls: ${VALHALLA_TILE_URL:-https://download.geofabrik.de/europe/alps-latest.osm.pbf}
      use_tiles_ignore_pbf: "False"
      build_elevation: "True"
      build_admins: "True"
      build_time_zones: "True"
      serve_tiles: "True"
      force_rebuild: "False"
    volumes:
      - valhalla_tiles:/custom_files

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    depends_on:
      - db
      - mosquitto
      - valhalla
    env_file:
      - ./backend/.env.production
    environment:
      MQTT_HOST: mosquitto
      MQTT_PORT: "1883"
      MOSQUITTO_PASSWORD_FILE: /mosquitto/secrets/passwords
    restart: unless-stopped
    expose:
      - "8000"
    volumes:
      - backend_uploads:/app/storage/uploads
      - backend_apks:/app/storage/apks
      - raster_cache:/app/storage/raster_cache
      - ${MOSQUITTO_SECRET_DIR:-./mosquitto/secrets}:/mosquitto/secrets

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    depends_on:
      - backend
    env_file:
      - ./frontend/.env.production
    restart: unless-stopped
    expose:
      - "3000"

  car-tls:
    image: caddy:2.10
    profiles:
      - car-tls
    depends_on:
      - frontend
    restart: unless-stopped
    ports:
      - "${CAR_TLS_HTTP_BIND:-0.0.0.0}:${CAR_TLS_HTTP_PORT:-80}:80"
      - "${CAR_TLS_HTTPS_BIND:-0.0.0.0}:${CAR_TLS_HTTPS_PORT:-443}:443"
    environment:
      ACME_AGREE: "true"
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  cloudflared:
    image: cloudflare/cloudflared:2026.3.0
    profiles:
      - cloudflare
    depends_on:
      - frontend
      - backend
    restart: unless-stopped
    command: tunnel --config /etc/cloudflared/config.yml run
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./deploy/cloudflared/config.yml:/etc/cloudflared/config.yml:ro
      - ./deploy/cloudflared:/etc/cloudflared:ro

volumes:
  postgres_data:
  backend_uploads:
  backend_apks:
  mosquitto_data:
  mosquitto_log:
  raster_cache:
  valhalla_tiles:
  caddy_data:
  caddy_config:
