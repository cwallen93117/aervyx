version: "3.9"

services:
  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    command: postgres -c shared_buffers=256MB -c work_mem=16MB -c effective_cache_size=512MB -c random_page_cost=1.1 -c max_connections=100
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-flightcomp}
      POSTGRES_USER: ${POSTGRES_USER:-flightcomp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-flightcomp}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  mosquitto:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./mosquitto/config/conf.d:/mosquitto/config/conf.d:ro
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log

  valhalla:
    image: ghcr.io/gis-ops/docker-valhalla/valhalla:latest
    restart: unless-stopped
    environment:
      tile_urls: ${VALHALLA_TILE_URL:-https://download.geofabrik.de/europe/alps-latest.osm.pbf}
      use_tiles_ignore_pbf: "False"
      build_elevation: "True"
      build_admins: "True"
      build_time_zones: "True"
      serve_tiles: "True"
      force_rebuild: "False"
    ports:
      - "8002:8002"
    volumes:
      - valhalla_tiles:/custom_files

  backend:
    build:
      context: ./backend
    depends_on:
      - db
      - mosquitto
      - valhalla
    env_file:
      - ./backend/.env
    environment:
      MQTT_HOST: mosquitto
      MQTT_PORT: "1883"
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - backend_uploads:/app/storage/uploads
      - backend_apks:/app/storage/apks

  frontend:
    build:
      context: ./frontend
    depends_on:
      - backend
    env_file:
      - ./frontend/.env.local
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-flightcomp}:${POSTGRES_PASSWORD:-flightcomp}@db:5432/${POSTGRES_DB:-flightcomp}
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  postgres_data:
  backend_uploads:
  backend_apks:
  mosquitto_data:
  mosquitto_log:
  valhalla_tiles:
